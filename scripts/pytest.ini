[pytest]
# Pytest configuration for app/scripts (Python sync/backfill scripts).
# Mirrors mcps/garmin/pytest.ini conventions.

python_files = test_*.py
python_classes = Test*
python_functions = test_*

testpaths = tests

minversion = 7.0

addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

markers =
    unit: Unit tests (fast, isolated, mocked)
    integration: Integration tests (mocked Supabase/API clients)

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
